version: "3.8"

services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: oracle
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD}
      APP_USER: dbuser
      APP_USER_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - ./sql:/container-entrypoint-initdb.d

  tomcat:
    image: tomcat:10.1-jdk25
    container_name: tomcat
    ports:
      - "8080:8080"
    volumes:
      - ./target/ROOT.war:/usr/local/tomcat/webapps/ROOT.war
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_NAME: FREEPDB1
      DB_USER: dbuser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - oracle
